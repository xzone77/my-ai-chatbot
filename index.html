<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XZone AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    :root {
      --bg: #05060a;
      --panel: rgba(15, 17, 25, 0.78);
      --panel2: rgba(22, 24, 34, 0.72);
      --border: rgba(255, 255, 255, 0.09);
      --text: #f5f7ff;
      --muted: #9298aa;
      --accent: #7c6cff;
      --accent2: #39b8ff;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    /* =====================================
       ANIMATED 3D BACKGROUND
    ====================================== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -10;
      background:
        radial-gradient(circle at 20% 20%, rgba(91, 74, 255, 0.15), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(0, 170, 255, 0.12), transparent 30%),
        radial-gradient(circle at 50% 100%, rgba(145, 0, 255, 0.10), transparent 35%),
        #05060a;
    }

    .background::before {
      content: "";
      position: absolute;
      inset: -50%;
      background:
        radial-gradient(circle at 30% 30%, rgba(124, 108, 255, 0.16), transparent 20%),
        radial-gradient(circle at 70% 60%, rgba(57, 184, 255, 0.12), transparent 20%),
        radial-gradient(circle at 50% 80%, rgba(180, 70, 255, 0.10), transparent 22%);
      filter: blur(60px);
      animation: backgroundMove 18s ease-in-out infinite alternate;
    }

    @keyframes backgroundMove {
      0% {
        transform: translate3d(-5%, -3%, 0) rotate(0deg) scale(1);
      }

      50% {
        transform: translate3d(6%, 5%, 0) rotate(8deg) scale(1.08);
      }

      100% {
        transform: translate3d(-2%, 8%, 0) rotate(-7deg) scale(1.15);
      }
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(1px);
      opacity: 0.35;
      mix-blend-mode: screen;
      box-shadow:
        inset -20px -20px 40px rgba(0, 0, 0, 0.5),
        inset 10px 10px 30px rgba(255, 255, 255, 0.08),
        0 0 80px rgba(100, 100, 255, 0.15);
    }

    .orb1 {
      width: 280px;
      height: 280px;
      left: -100px;
      top: 10%;
      background: radial-gradient(
        circle at 35% 30%,
        #8d82ff,
        #393177 40%,
        #080912 75%
      );
      animation: orbOne 17s ease-in-out infinite alternate;
    }

    .orb2 {
      width: 360px;
      height: 360px;
      right: -130px;
      bottom: 0;
      background: radial-gradient(
        circle at 30% 30%,
        #51caff,
        #174e72 40%,
        #05070c 75%
      );
      animation: orbTwo 21s ease-in-out infinite alternate;
    }

    .orb3 {
      width: 170px;
      height: 170px;
      right: 25%;
      top: 8%;
      background: radial-gradient(
        circle at 35% 30%,
        #b08cff,
        #45227d 45%,
        #08070d 75%
      );
      animation: orbThree 13s ease-in-out infinite alternate;
    }

    @keyframes orbOne {
      0% {
        transform: translate3d(0, 0, 0) rotate(0deg);
      }

      100% {
        transform: translate3d(160px, 100px, 120px) rotate(180deg);
      }
    }

    @keyframes orbTwo {
      0% {
        transform: translate3d(0, 0, 0) scale(1);
      }

      100% {
        transform: translate3d(-150px, -120px, 80px) scale(1.2);
      }
    }

    @keyframes orbThree {
      0% {
        transform: translate3d(0, 0, 0);
      }

      100% {
        transform: translate3d(-120px, 160px, 100px) scale(0.8);
      }
    }

    .grid {
      position: absolute;
      width: 150%;
      height: 150%;
      left: -25%;
      top: -25%;
      opacity: 0.08;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.12) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.12) 1px, transparent 1px);
      background-size: 55px 55px;
      transform: perspective(600px) rotateX(65deg) translateY(180px);
      animation: gridMove 15s linear infinite;
    }

    @keyframes gridMove {
      from {
        background-position: 0 0;
      }

      to {
        background-position: 0 550px;
      }
    }

    /* =====================================
       APP
    ====================================== */

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      position: relative;
      backdrop-filter: blur(2px);
    }

    /* =====================================
       SIDEBAR
    ====================================== */

    .sidebar {
      width: 260px;
      height: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;

      background: rgba(8, 9, 14, 0.72);
      border-right: 1px solid var(--border);

      box-shadow:
        10px 0 40px rgba(0, 0, 0, 0.35),
        inset -1px 0 rgba(255, 255, 255, 0.02);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 25px;
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    .logo-orb {
      width: 38px;
      height: 38px;
      border-radius: 12px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(circle at 30% 25%, #ffffff, #8174ff 20%, #29205d 65%, #090a12 100%);

      box-shadow:
        0 8px 20px rgba(89, 76, 255, 0.35),
        inset 3px 3px 8px rgba(255, 255, 255, 0.25),
        inset -5px -5px 12px rgba(0, 0, 0, 0.65);

      transform: translateZ(20px);
      animation: logoFloat 4s ease-in-out infinite;
    }

    @keyframes logoFloat {
      0%,
      100% {
        transform: translateY(0) rotateY(0deg);
      }

      50% {
        transform: translateY(-3px) rotateY(12deg);
      }
    }

    .logo-orb span {
      font-size: 17px;
      font-weight: bold;
      color: white;
      text-shadow: 0 2px 8px black;
    }

    .new-chat {
      width: 100%;
      border: 1px solid rgba(255, 255, 255, 0.10);
      color: white;

      background:
        linear-gradient(
          145deg,
          rgba(40, 42, 55, 0.95),
          rgba(13, 14, 21, 0.95)
        );

      padding: 13px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;

      box-shadow:
        0 8px 0 #08090d,
        0 14px 25px rgba(0, 0, 0, 0.35),
        inset 1px 1px 1px rgba(255, 255, 255, 0.10);

      transition: 0.18s ease;
    }

    .new-chat:hover {
      transform: translateY(-3px);
      box-shadow:
        0 11px 0 #08090d,
        0 18px 30px rgba(80, 70, 255, 0.18),
        inset 1px 1px 1px rgba(255, 255, 255, 0.13);
    }

    .new-chat:active {
      transform: translateY(5px);
      box-shadow:
        0 3px 0 #08090d,
        0 8px 15px rgba(0, 0, 0, 0.4);
    }

    .history-title {
      color: #777d91;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin: 27px 5px 10px;
    }

    .history {
      padding: 12px 13px;
      border-radius: 12px;
      font-size: 13px;
      color: #c7cad5;

      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.055);

      box-shadow:
        inset 0 1px rgba(255, 255, 255, 0.03),
        0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .status-card {
      margin-top: auto;
      padding: 12px;
      border-radius: 13px;

      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #a8adbd;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #52e39a;
      box-shadow: 0 0 12px rgba(82, 227, 154, 0.8);
    }

    /* =====================================
       MAIN
    ====================================== */

    .main {
      flex: 1;
      min-width: 0;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      height: 64px;
      flex-shrink: 0;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 27px;

      background: rgba(7, 8, 13, 0.48);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);

      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);

      font-size: 16px;
      font-weight: 600;
    }

    .top-title {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .top-light {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8b7cff;
      box-shadow: 0 0 15px #7161ff;
      animation: pulseLight 2s infinite;
    }

    @keyframes pulseLight {
      0%,
      100% {
        opacity: 0.5;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.15);
      }
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .model {
      font-size: 11px;
      color: #777d91;
      padding: 6px 10px;
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.025);
    }

    /* =====================================
       LOGIN BUTTON
    ====================================== */

    .auth-open-btn {
      min-width: 90px;
      padding: 9px 16px;
      border-radius: 11px;

      color: white;
      font-size: 12px;
      font-weight: 700;

      background:
        linear-gradient(
          145deg,
          #756aff,
          #4337a0
        );

      border: 1px solid rgba(255, 255, 255, 0.15);

      box-shadow:
        0 5px 0 #211b59,
        0 10px 20px rgba(70, 60, 220, 0.25),
        inset 1px 1px 3px rgba(255, 255, 255, 0.25),
        inset -2px -3px 5px rgba(0, 0, 0, 0.25);

      transition: 0.16s ease;
    }

    .auth-open-btn:hover {
      transform: translateY(-3px);
      box-shadow:
        0 8px 0 #211b59,
        0 15px 25px rgba(70, 60, 220, 0.35),
        inset 1px 1px 3px rgba(255, 255, 255, 0.28);
    }

    .auth-open-btn:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #211b59,
        0 5px 10px rgba(0, 0, 0, 0.35);
    }

    /* =====================================
       CHAT
    ====================================== */

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 40px 15%;
      scroll-behavior: smooth;
    }

    .chat::-webkit-scrollbar {
      width: 7px;
    }

    .chat::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.10);
      border-radius: 10px;
    }

    .welcome {
      max-width: 760px;
      margin: 11vh auto 0;
      text-align: center;
      animation: welcomeIn 0.8s ease;
    }

    @keyframes welcomeIn {
      from {
        opacity: 0;
        transform: translateY(25px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .welcome-orb {
      width: 82px;
      height: 82px;
      margin: 0 auto 25px;
      border-radius: 25px;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ffffff,
          #8174ff 18%,
          #332875 48%,
          #080912 78%
        );

      box-shadow:
        0 20px 50px rgba(91, 74, 255, 0.30),
        inset 6px 6px 15px rgba(255, 255, 255, 0.16),
        inset -10px -10px 20px rgba(0, 0, 0, 0.7);

      animation: welcomeOrb 5s ease-in-out infinite;
    }

    @keyframes welcomeOrb {
      0%,
      100% {
        transform: translateY(0) rotateX(0) rotateY(0);
      }

      50% {
        transform: translateY(-10px) rotateX(8deg) rotateY(15deg);
      }
    }

    .welcome h1 {
      font-size: clamp(30px, 4vw, 46px);
      margin-bottom: 12px;
      letter-spacing: -1.5px;

      background: linear-gradient(
        120deg,
        #ffffff,
        #bfc5ff,
        #8d82ff,
        #ffffff
      );

      background-size: 250% auto;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      animation: titleShine 7s linear infinite;
    }

    @keyframes titleShine {
      to {
        background-position: 250% center;
      }
    }

    .welcome p {
      color: #8e94a7;
      font-size: 15px;
    }

    .suggestions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 28px;
    }

    .suggestion {
      padding: 10px 14px;
      border-radius: 12px;
      color: #aeb3c5;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      cursor: pointer;
      font-size: 12px;

      box-shadow:
        0 5px 0 rgba(0, 0, 0, 0.4),
        inset 0 1px rgba(255, 255, 255, 0.05);

      transition: 0.18s;
    }

    .suggestion:hover {
      color: white;
      transform: translateY(-3px);
      border-color: rgba(124, 108, 255, 0.35);
      box-shadow:
        0 8px 0 rgba(0, 0, 0, 0.4),
        0 12px 25px rgba(80, 70, 255, 0.10);
    }

    .message {
      max-width: 820px;
      margin: 0 auto 25px;
      animation: messageIn 0.35s ease;
    }

    @keyframes messageIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .user {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 700;
      color: #9298ad;
      letter-spacing: 0.4px;
    }

    .user-text {
      display: inline-block;
      max-width: 85%;
      padding: 13px 16px;
      border-radius: 17px 17px 5px 17px;

      color: #f5f6ff;
      background:
        linear-gradient(
          145deg,
          rgba(54, 52, 75, 0.92),
          rgba(24, 24, 35, 0.94)
        );

      border: 1px solid rgba(255, 255, 255, 0.08);

      box-shadow:
        0 8px 0 rgba(0, 0, 0, 0.30),
        0 15px 30px rgba(0, 0, 0, 0.20),
        inset 1px 1px rgba(255, 255, 255, 0.08);

      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai {
      padding: 18px 20px;
      border-radius: 17px;

      background:
        linear-gradient(
          145deg,
          rgba(25, 27, 38, 0.88),
          rgba(12, 13, 19, 0.92)
        );

      border: 1px solid rgba(255, 255, 255, 0.075);

      box-shadow:
        0 10px 0 rgba(0, 0, 0, 0.25),
        0 20px 35px rgba(0, 0, 0, 0.20),
        inset 1px 1px rgba(255, 255, 255, 0.045);

      color: #e8eaf2;
      line-height: 1.65;

      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .ai-label {
      color: #9b8fff;
    }

    /* =====================================
       INPUT
    ====================================== */

    .input-area {
      flex-shrink: 0;
      padding: 12px 15% 10px;

      background: linear-gradient(
        to top,
        rgba(5, 6, 10, 0.95),
        rgba(5, 6, 10, 0.60),
        transparent
      );
    }

    .input-box {
      min-height: 65px;
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 8px;

      border-radius: 20px;

      background:
        linear-gradient(
          145deg,
          rgba(28, 30, 42, 0.94),
          rgba(10, 11, 17, 0.96)
        );

      border: 1px solid rgba(255, 255, 255, 0.09);

      box-shadow:
        0 12px 0 rgba(0, 0, 0, 0.40),
        0 22px 45px rgba(0, 0, 0, 0.35),
        inset 2px 2px 4px rgba(255, 255, 255, 0.06),
        inset -4px -4px 10px rgba(0, 0, 0, 0.35);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      transition: 0.25s ease;
    }

    .input-box:focus-within {
      border-color: rgba(124, 108, 255, 0.30);

      box-shadow:
        0 12px 0 rgba(0, 0, 0, 0.40),
        0 25px 50px rgba(0, 0, 0, 0.38),
        0 0 35px rgba(91, 74, 255, 0.10),
        inset 2px 2px 4px rgba(255, 255, 255, 0.06);
    }

    textarea {
      flex: 1;
      min-width: 0;
      height: 45px;

      border: none;
      outline: none;
      resize: none;

      padding: 11px 10px;

      color: white;
      background: transparent;

      font-size: 14px;
    }

    textarea::placeholder {
      color: #6e7487;
    }

    button {
      border: none;
      outline: none;
      cursor: pointer;
    }

    /* =====================================
       3D BUTTONS
    ====================================== */

    .mic,
    .send {
      flex-shrink: 0;
      width: 45px;
      height: 45px;
      border-radius: 14px;

      display: flex;
      align-items: center;
      justify-content: center;

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease,
        background 0.2s ease;
    }

    .mic {
      color: #b8bdce;

      background:
        linear-gradient(
          145deg,
          #292c39,
          #101117
        );

      box-shadow:
        0 6px 0 #08090c,
        0 10px 18px rgba(0, 0, 0, 0.35),
        inset 1px 1px rgba(255, 255, 255, 0.08);
    }

    .mic:hover {
      color: white;
      transform: translateY(-3px);
      box-shadow:
        0 9px 0 #08090c,
        0 15px 25px rgba(0, 0, 0, 0.4);
    }

    .mic:active {
      transform: translateY(4px);
      box-shadow:
        0 2px 0 #08090c,
        0 5px 10px rgba(0, 0, 0, 0.4);
    }

    .mic.listening {
      color: white;
      background:
        linear-gradient(
          145deg,
          #6258c9,
          #29245b
        );

      box-shadow:
        0 6px 0 #15122f,
        0 0 30px rgba(124, 108, 255, 0.40);
      animation: micPulse 1.1s infinite;
    }

    @keyframes micPulse {
      50% {
        transform: scale(1.06);
      }
    }

    .send {
      color: white;

      background:
        linear-gradient(
          145deg,
          #8c80ff,
          #5146b9 50%,
          #30286f
        );

      box-shadow:
        0 7px 0 #1c1742,
        0 12px 25px rgba(88, 74, 255, 0.28),
        inset 2px 2px 5px rgba(255, 255, 255, 0.22),
        inset -3px -4px 7px rgba(0, 0, 0, 0.28);

      font-size: 21px;
      font-weight: bold;
    }

    .send:hover {
      transform: translateY(-3px) scale(1.02);

      box-shadow:
        0 10px 0 #1c1742,
        0 18px 32px rgba(88, 74, 255, 0.38),
        inset 2px 2px 5px rgba(255, 255, 255, 0.25);
    }

    .send:active {
      transform: translateY(5px);

      box-shadow:
        0 2px 0 #1c1742,
        0 7px 12px rgba(0, 0, 0, 0.35);
    }

    .send:disabled {
      cursor: not-allowed;
    }

    .send-icon {
      display: block;
      transform: translateX(1px) rotate(-2deg);
    }

    .footer {
      text-align: center;
      color: #666c7d;
      font-size: 10px;
      padding: 11px 0 2px;
    }

    /* =====================================
       AUTH OVERLAY
    ====================================== */

    .auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: none;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(0, 0, 0, 0.68);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .auth-overlay.show {
      display: flex;
      animation: authFade 0.25s ease;
    }

    @keyframes authFade {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .auth-card {
      width: min(420px, 100%);
      padding: 30px;

      position: relative;

      border-radius: 25px;

      background:
        linear-gradient(
          145deg,
          rgba(31, 33, 47, 0.97),
          rgba(9, 10, 16, 0.98)
        );

      border: 1px solid rgba(255, 255, 255, 0.11);

      box-shadow:
        0 25px 0 rgba(0, 0, 0, 0.45),
        0 40px 80px rgba(0, 0, 0, 0.60),
        inset 2px 2px 5px rgba(255, 255, 255, 0.07),
        inset -5px -5px 15px rgba(0, 0, 0, 0.35);

      transform: perspective(900px) rotateX(0deg);
      animation: authCardIn 0.35s ease;
    }

    @keyframes authCardIn {
      from {
        opacity: 0;
        transform: perspective(900px) rotateX(8deg) translateY(25px) scale(0.96);
      }

      to {
        opacity: 1;
        transform: perspective(900px) rotateX(0deg) translateY(0) scale(1);
      }
    }

    .auth-close {
      position: absolute;
      right: 16px;
      top: 14px;

      width: 34px;
      height: 34px;

      border-radius: 10px;

      color: #bfc4d5;
      font-size: 21px;

      background:
        linear-gradient(
          145deg,
          #292c39,
          #101117
        );

      box-shadow:
        0 4px 0 #08090d,
        inset 1px 1px rgba(255, 255, 255, 0.08);

      transition: 0.15s;
    }

    .auth-close:hover {
      color: white;
      transform: translateY(-2px);
    }

    .auth-close:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #08090d;
    }

    .auth-logo {
      width: 55px;
      height: 55px;
      margin-bottom: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

  <!-- =====================================
       MAIN CHAT JAVASCRIPT
  ====================================== -->

  <script>

    let isSending = false;
    let recognition = null;


    /* =====================================
       ENTER KEY
    ====================================== */

    function handleKey(event) {

      if (
        event.key === "Enter" &&
        !event.shiftKey
      ) {

        event.preventDefault();

        sendMessage();

      }

    }


    /* =====================================
       SUGGESTION
    ====================================== */

    function useSuggestion(text) {

      const input =
        document.getElementById("message");

      if (!input) {
        return;
      }

      input.value = text;

      input.focus();

    }


    /* =====================================
       SEND MESSAGE
    ====================================== */

    async function sendMessage() {

      if (isSending) {
        return;
      }

      const input =
        document.getElementById("message");

      const chat =
        document.getElementById("chat");

      const welcome =
        document.getElementById("welcome");

      const sendButton =
        document.getElementById("sendButton");

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      if (welcome) {
        welcome.remove();
      }


      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message";

      userMessage.innerHTML = `

        <div class="user">
          You
        </div>

        <div class="user-text">
          ${escapeHTML(message)}
        </div>

      `;

      chat.appendChild(userMessage);


      input.value = "";


      const aiMessage =
        document.createElement("div");

      aiMessage.className =
        "message";

      aiMessage.innerHTML = `

        <div class="user ai-label">
          XZone AI
        </div>

        <div class="ai">
          Thinking...
        </div>

      `;

      chat.appendChild(aiMessage);


      chat.scrollTop =
        chat.scrollHeight;


      isSending = true;


      if (sendButton) {

        sendButton.disabled = true;

        sendButton.style.opacity = "0.45";

      }


      try {

        let data = null;

        let lastError = null;


        for (
          let attempt = 1;
          attempt <= 2;
          attempt++
        ) {

          try {

            const response =
              await fetch(
                "/api/chat",
                {
                  method: "POST",

                  headers: {
                    "Content-Type":
                      "application/json"
                  },

                  body:
                    JSON.stringify({
                      message: message
                    })
                }
              );


            const responseText =
              await response.text();


            let responseData = null;


            try {

              responseData =
                JSON.parse(responseText);

            } catch (jsonError) {

              throw new Error(
                "Server returned an invalid response."
              );

            }


            if (!response.ok) {

              throw new Error(
                responseData.error ||
                "AI request failed."
              );

            }


            if (
              !responseData.reply ||
              typeof responseData.reply !== "string"
            ) {

              throw new Error(
                "AI returned an empty response."
              );

            }


            data =
              responseData;

            break;


          } catch (error) {

            lastError =
              error;

            console.error(
              "API attempt " +
              attempt +
              ":",
              error
            );


            if (attempt < 2) {

              await sleep(800);

            }

          }

        }


        if (!data) {

          throw (
            lastError ||
            new Error(
              "Request failed."
            )
          );

        }


        aiMessage
          .querySelector(".ai")
          .textContent =
          data.reply;


        speakText(data.reply);


      } catch (error) {

        console.error(
          "XZone AI error:",
          error
        );


        aiMessage
          .querySelector(".ai")
          .textContent =
          "Sorry, something went wrong. Please try again.";

      } finally {

        isSending = false;


        if (sendButton) {

          sendButton.disabled = false;

          sendButton.style.opacity = "1";

        }


        chat.scrollTop =
          chat.scrollHeight;

      }

    }


    /* =====================================
       TEXT TO SPEECH
    ====================================== */

    function speakText(text) {

      if (
        !("speechSynthesis" in window)
      ) {

        console.log(
          "Speech synthesis is not supported."
        );

        return;

      }


      if (
        !text ||
        !text.trim()
      ) {

        return;

      }


      const synth =
        window.speechSynthesis;


      synth.cancel();


      const speech =
        new SpeechSynthesisUtterance(text);


      speech.rate = 1;
      speech.pitch = 1;
      speech.volume = 1;


      if (
        /[\u0900-\u097F]/.test(text)
      ) {

        speech.lang =
          "hi-IN";

      } else {

        speech.lang =
          "en-IN";

      }


      const voices =
        synth.getVoices();


      let selectedVoice =
        null;


      if (
        speech.lang === "hi-IN"
      ) {

        selectedVoice =
          voices.find(
            voice =>
              voice.lang &&
              voice.lang
                .toLowerCase()
                .startsWith("hi")
          );

      } else {

        selectedVoice =
          voices.find(
            voice =>
              voice.lang &&
              voice.lang
                .toLowerCase()
                .startsWith("en-in")
          );


        if (!selectedVoice) {

          selectedVoice =
            voices.find(
              voice =>
                voice.lang &&
                voice.lang
                  .toLowerCase()
                  .startsWith("en")
            );

        }

      }


      if (selectedVoice) {

        speech.voice =
          selectedVoice;

      }


      setTimeout(
        function () {

          try {

            synth.speak(
              speech
            );

          } catch (error) {

            console.error(
              "Voice error:",
              error
            );

          }

        },
        100
      );

    }


    /* =====================================
       LOAD VOICES
    ====================================== */

    if (
      "speechSynthesis" in window
    ) {

      window.speechSynthesis
        .onvoiceschanged =
        function () {

          window.speechSynthesis
            .getVoices();

        };

    }


    /* =====================================
       NEW CHAT
    ====================================== */

    function newChat() {

      if (
        "speechSynthesis" in window
      ) {

        window.speechSynthesis.cancel();

      }


      if (recognition) {

        try {

          recognition.stop();

        } catch (error) {

          console.log(error);

        }

        recognition = null;

      }


      const chat =
        document.getElementById("chat");


      chat.innerHTML = `

        <div
          class="welcome"
          id="welcome">

          <div class="welcome-orb"></div>

          <h1>
            How can I help you?
          </h1>

          <p>
            Ask anything to XZone AI
          </p>

          <div class="suggestions">

            <button
              class="suggestion"
              onclick="useSuggestion('Explain something to me')">

              Explain something

            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Help me learn something new')">

              Learn something

            </button>

            <button
              class="suggestion"
              onclick="useSuggestion('Help me with an idea')">

              Create an idea

            </button>

          </div>

        </div>

      `;

    }


    /* =====================================
       VOICE INPUT
    ====================================== */

    function startVoice() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


      if (!SpeechRecognition) {

        alert(
          "Voice recognition is not supported in this browser. Please use Google Chrome."
        );

        return;

      }


      if (recognition) {

        try {

          recognition.stop();

        } catch (error) {

          console.log(error);

        }

        recognition = null;

        return;

      }


      recognition =
        new SpeechRecognition();


      recognition.lang =
        "en-IN";


      recognition.continuous =
        false;


      recognition.interimResults =
        false;


      const micButton =
        document.getElementById(
          "micButton"
        );


      recognition.onstart =
        function () {

          if (micButton) {

            micButton.classList.add(
              "listening"
            );

          }

        };


      recognition.onresult =
        function (event) {

          const transcript =
            event.results[0][0]
              .transcript;


          const input =
            document.getElementById(
              "message"
            );


          input.value =
            transcript;


          setTimeout(
            function () {

              sendMessage();

            },
            200
          );

        };


      recognition.onerror =
        function (event) {

          console.error(
            "Speech recognition error:",
            event.error
          );

        };


      recognition.onend =
        function () {

          if (micButton) {

            micButton.classList.remove(
              "listening"
            );

          }

          recognition =
            null;

        };


      try {

        recognition.start();

      } catch (error) {

        console.error(
          "Microphone error:",
          error
        );

        recognition =
          null;

      }

    }


    /* =====================================
       ESCAPE HTML
    ====================================== */

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =====================================
       SLEEP
    ====================================== */

    function sleep(ms) {

      return new Promise(
        resolve =>
          setTimeout(
            resolve,
            ms
          )
      );

    }

  </script>

    /* =====================================

    ====================================== */

    async function signUpWithEmail() {

      const email =
        document
          .getElementById("authEmail")
          .value
          .trim();


      const password =
        document
          .getElementById("authPassword")
          .value;


      if (!email || !password) {

        setAuthMessage(
          "Please enter email and password.",
          true
        );

        return;

      }


      if (password.length < 6) {

        setAuthMessage(
          "Password must be at least 6 characters.",
          true
        );

        return;

      }


      setAuthMessage(
        "Creating your account..."
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });


      if (error) {

        console.error(
          "Signup error:",
          error
        );

        setAuthMessage(
          error.message,
          true
        );

        return;

      }


      if (data.session) {

        setAuthMessage(
          "Account created successfully."
        );

        updateAuthUI(
          data.session
        );


        setTimeout(
          closeAuth,
          700
        );

      } else {

        setAuthMessage(
          "Account created. Check your email to verify your account."

        return;

      }


      setAuthMessage(
        "Logging in..."
      );


      const {
        data,
        error
      } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });


      if (error) {

        console.error(
          "Login error:",
          error
        );

        setAuthMessage(
          error.message,
          true
        );

        return;

      }


      setAuthMessage(
        "Login successful."
      );


      updateAuthUI(
        data.session
      );


      setTimeout(
        closeAuth,
        700
      );

    }


    /* =====================================
       GITHUB LOGIN
    ====================================== */

    async function loginWithGitHub() {

      setAuthMessage(
        "Connecting to GitHub..."
      );


      const {
        error
      } =
        await supabaseClient.auth.signInWithOAuth({

          provider:
            "github",

          options: {

            redirectTo:
              window.location.origin

          }

        });


      if (error) {

        console.error(
          "GitHub login error:",
          error
        );

        setAuthMessage(
          error.message,
          true
        );

      }

    }


    /* =====================================
       LOGOUT
    ====================================== */

    async function logoutUser() {

      setAuthMessage(
        "Logging out..."
      );


      const {
        error
      } =
        await supabaseClient.auth.signOut();


      if (error) {

        console.error(
          "Logout error:",
          error
        );

        setAuthMessage(
          error.message,
          true
        );

        return;

      }


      updateAuthUI(
        null
      );


      setAuthMessage(
        "Logged out successfully."
      );

    }


    /* =====================================
       UPDATE AUTH UI
    ====================================== */

    function updateAuthUI(session) {

      const button =
        document.getElementById(
          "authOpenButton"
        );


      const logoutButton =
        document.getElementById(
          "authLogoutButton"
        );


      const userBox =
        document.getElementById(
          "authUser"
        );


      const statusText =
        document.getElementById(
          "statusText"
        );


      if (
        session &&
        session.user
      ) {

        const email =
          session.user.email ||
          "Signed in";


        if (button) {

          button.textContent =
            "Account";

        }


        if (logoutButton) {

          logoutButton.style.display =
            "block";

        }


        if (userBox) {

          userBox.textContent =
            email;

        }


        if (statusText) {

          statusText.textContent =
            "Signed in";

        }

      } else {

        if (button) {

          button.textContent =
            "Login";

        }


        if (logoutButton) {

          logoutButton.style.display =
            "none";

        }


        if (userBox) {

          userBox.textContent =
            "";

        }


        if (statusText) {

          statusText.textContent =
            "XZone AI Online";

        }

      }

    }


    /* =====================================
       INITIALIZE AUTH
    ====================================== */

    async function initAuth() {

      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

          return;

        }


        updateAuthUI(
          data.session
        );


        supabaseClient.auth.onAuthStateChange(
          function (
            event,
            session
          ) {

            console.log(
              "Auth event:",
              event
            );


            updateAuthUI(
              session
            );

          }
        );


      } catch (error) {

        console.error(
          "Auth initialization error:",
          error
        );

      }

    }


    /* =====================================
       START AUTH
    ====================================== */

    initAuth();

  </script>

</body>

</html>
